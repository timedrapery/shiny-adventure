name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          # The health dashboard dates the review queue from the commit
          # that added each item, which a shallow checkout cannot answer.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      # Runs the unit tests, schema validation, lint, drift, and every other
      # repository check; see scripts/run_checks.py for the full list.
      - name: Run full verification suite
        run: python scripts/run_checks.py
      # The reader deploys from main, so a pull request that would break the
      # site should fail here rather than at deploy time.
      - name: Build the reader's edition
        run: mkdocs build --strict
      - uses: pnpm/action-setup@v6
        if: matrix.python-version == '3.12'
        with:
          version: 10
      - uses: actions/setup-node@v7
        if: matrix.python-version == '3.12'
        with:
          node-version: "22"
          cache: pnpm
      - name: Install rendered-accessibility dependencies
        if: matrix.python-version == '3.12'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: matrix.python-version == '3.12'
        # The runner image already has the libraries Chromium needs; --with-deps
        # also fetches optional fonts from the Ubuntu archive. If the archive is
        # unreachable, install the browser alone rather than fail the job.
        run: |
          pnpm exec playwright install --with-deps chromium \
            || pnpm exec playwright install chromium
      - name: Check the rendered reader
        if: matrix.python-version == '3.12'
        run: pnpm test:a11y
      - name: Export repo health JSON
        run: python scripts/repo_health.py --format json > repo-health.json
      # The dashboard's JSON carries the full detail lists and the whole weekly
      # series, not just the summary the Markdown shows.
      - name: Export health dashboard JSON
        run: python scripts/health_dashboard.py --format json > health-dashboard.json
      - name: Export health dashboard HTML
        run: python scripts/health_dashboard.py --format html > health-dashboard.html
      - name: Upload repo health artifact
        uses: actions/upload-artifact@v7
        with:
          name: repo-health-py${{ matrix.python-version }}
          path: |
            repo-health.json
            health-dashboard.json
            health-dashboard.html
