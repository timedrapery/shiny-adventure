name: Deploy Reader's Edition

# The reader is now a generated presentation layer over the governed
# translation corpus rather than a hand-maintained prototype, so it deploys
# automatically from main. The gate is real: the full verification suite, the
# reader-generation check, and a strict MkDocs build all have to pass in the
# same job before anything is published. A reader that has drifted from the
# governed surfaces fails `generate_reader.py --check` and never reaches the
# deploy job.
#
# Only changes that can affect the site trigger it. Term-record edits reach the
# reader through the glossary, so terms/ is included.
on:
  push:
    branches: [main]
    paths:
      - "docs/translations/**"
      - "reader-src/**"
      - "includes/**"
      - "terms/**"
      - "scripts/**"
      - "mkdocs.yml"
      - "requirements-dev.txt"
      - "package.json"
      - "pnpm-lock.yaml"
      - "playwright.config.js"
      - "tests/browser/**"
      - ".github/workflows/deploy-reader.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer commit supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # The full suite already includes the reader-generation check and the
      # Markdown structure check, so a drifted or damaged reader stops here.
      - name: Run full verification suite
        run: python scripts/run_checks.py

      # Belt and braces: fail loudly and specifically if the reader is stale,
      # rather than leaving the reason buried in the suite output.
      - name: Confirm the reader is current
        run: python scripts/generate_reader.py --check

      - name: Build site
        run: mkdocs build --strict

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install rendered-accessibility dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check the rendered reader
        run: pnpm test:a11y

      # The downloadable edition is assembled from the generated reader pages
      # and written into the built site, so it has to come after MkDocs (which
      # cleans site/ on every build) and before the artifact is uploaded.
      # pandoc is only needed here, not for an ordinary local site build.
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Build downloadable edition
        run: python scripts/build_book.py
      - name: Validate downloadable edition
        run: python scripts/check_epub.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
