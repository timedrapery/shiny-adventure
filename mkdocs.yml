site_name: OSF Pali Readings
site_description: >-
  Early Buddhist sutta translations in plain, contemporary English, backed by a
  governed Pali lexicon. The reader's edition of the Open Sangha Foundation
  Pali Translation Lexicon.
repo_url: https://github.com/timedrapery/shiny-adventure
repo_name: timedrapery/shiny-adventure

docs_dir: reader-src
site_dir: site

theme:
  name: material
  font: false
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.tooltips
    - navigation.top

extra_css:
  - stylesheets/reader.css

extra_javascript:
  - javascripts/reader-filters.js

markdown_extensions:
  - abbr
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - admonition

# Glossary definitions are injected per page by scripts/generate_reader.py
# rather than auto-appended globally. Appending one shared glossary to every
# page meant a term could only ever carry one note across the whole site, even
# where the same English word does different work in different suttas.
# includes/glossary.md remains the hand-written reader-facing source.

# Makes Pali searchable without a Pali keyboard: adds ASCII spellings of
# accented words to the search index only, so "nibbana" finds "nibbāna".
# Touches nothing a reader sees on the page. See scripts/mkdocs_hooks.py.
hooks:
  - scripts/mkdocs_hooks.py

watch:
  - includes

nav:
  - Home: index.md
  - Start Here: start-here.md
